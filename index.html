<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>般若波羅蜜多心経</title>

<style>
    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:black;
        color:white;
        font-family:serif;
        overflow:hidden;
        touch-action:manipulation;
    }

    #文字{
        font-size:120px;
        user-select:none;
    }

    #説明{
        position:absolute;
        bottom:20px;
        font-size:14px;
        color:gray;
    }

    #数字{
        position:absolute;
        bottom:60px;
        font-size:30px;
        color:gray;
    }

    #タイトル{
        position:absolute;
        top:60px;
        font-size:30px;
        color:gray;
    }
</style>
</head>

<body>

<div id="タイトル">般若波羅蜜多心経</div>

<div id="文字"></div>

<div id="説明">
PC：Space / Backspace<br>
スマホ：右タップで次・左タップで戻る
</div>

<div id="数字"></div>

<script>

let 般若心経 = "仏説摩訶般若波羅蜜多心経観自在菩薩行深般若波羅蜜多時照見五蘊皆空度一切苦厄舎利子色不異空空不異色色即是空空即是色受想行識亦復如是舎利子是諸法空相不生不滅不垢不浄不増不減是故空中無色無受想行識無眼耳鼻舌身意無色声香味触法無眼界乃至無意識界無無明亦無無明尽乃至無老死亦無老死尽無苦集滅道無智亦無得以無所得故菩提薩埵依般若波羅蜜多故心無罣礙無罣礙故無有恐怖遠離一切顛倒夢想究竟涅槃三世諸仏依般若波羅蜜多故得阿耨多羅三藐三菩提故知般若波羅蜜多是大神呪是大明呪是無上呪是無等等呪能除一切苦真実不虚故説般若波羅蜜多呪即説呪曰羯諦羯諦波羅羯諦波羅僧羯諦菩提薩婆訶般若心経";

let index = 0;

const 文字 = document.getElementById("文字");
const 数字 = document.getElementById("数字");

function 表示更新(){
    文字.innerText = 般若心経[index];
    数字.innerText = index + 1 + " / " + 般若心経.length;
}

表示更新();


function 次へ(){
    if(index < 般若心経.length - 1){
        index++;
        表示更新();
    }
}

function 戻る(){
    if(index > 0){
        index--;
        表示更新();
    }
}

document.addEventListener("keydown", function(e){

    if(e.code === "Space"){
        e.preventDefault();
        次へ();
    }

    if(e.code === "Backspace"){
        e.preventDefault();
        戻る();
    }

});

document.addEventListener("touchstart", function(e){

    let x = e.touches[0].clientX;
    let width = window.innerWidth;


    if(x > width / 2){
        次へ();
    }

    else{
        戻る();
    }

});

document.addEventListener("click", function(e){

    let x = e.clientX;
    let width = window.innerWidth;

    if(x > width / 2){
        次へ();
    }else{
        戻る();
    }

});

</script>

</body>
</html>
